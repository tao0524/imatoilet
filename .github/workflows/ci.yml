name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    # フロントエンドのディレクトリ内でコマンドを実行する設定
    defaults:
      run:
        working-directory: ./toilet-frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './toilet-frontend/package-lock.json'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      # CI環境ではテストを監視モード(watch)にせず、1回だけ実行して終了させるため --run を付与します
      run: npm run test -- --run