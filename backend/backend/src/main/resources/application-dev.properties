# （既存の設定はそのまま）
spring.datasource.url=jdbc:h2:mem:imatoiletdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.flyway.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.cors.allowed-origins=http://localhost:4173,http://localhost:5173
app.cors.allow-credentials=false

server.port=8080
spring.jpa.open-in-view=false

# ★追加: ローカル開発用トークン (本番と同じ値を使わないこと)
app.admin.token=dev-admin-token-local