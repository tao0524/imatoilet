# ローカル開発用 H2データベース設定
spring.datasource.url=jdbc:h2:mem:imatoiletdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate 設定
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 変更後（テーブル構造はそのままで、Flywayにデータだけを入れさせる）
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Flyway を有効化（SQLファイルからデータを投入する）
spring.flyway.enabled=true

# H2コンソール設定
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS 設定
app.cors.allowed-origins=http://localhost:4173,http://localhost:5173
app.cors.allow-credentials=false

server.port=8080
spring.jpa.open-in-view=false

# ローカル開発用トークン (本番と同じ値を使わないこと)
app.admin.token=dev-admin-token-local