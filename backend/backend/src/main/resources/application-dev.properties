# ==========================================
# ローカル開発用プロファイル (H2 Database)
# 起動方法: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ==========================================

# H2 インメモリDB（PostgreSQLモード）
spring.datasource.url=jdbc:h2:mem:imatoiletdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA設定（H2用）
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Flyway無効化（マイグレーションSQLがPostgreSQL固有のため）
spring.flyway.enabled=false

# H2コンソール有効化（ブラウザでDBの中身を確認できる）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS（開発用）
app.cors.allowed-origins=http://localhost:4173,http://localhost:5173
app.cors.allow-credentials=false

# サーバー設定
server.port=8080

spring.jpa.open-in-view=false