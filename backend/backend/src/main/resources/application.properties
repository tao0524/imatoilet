# PostgreSQL への接続設定
# 環境変数 DB_URL, DB_USER, DB_PASSWORD があればそれを使い、なければデフォルト値を使います
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/imatoilet}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:MyNewPass3969}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate の設定
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CORS / Server Config ---
# WebConfig.java の @Value("${app.cors.allowed-origins}") と一致させています
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:5173}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# ポート設定
server.port=${PORT:8080}

# --- Flyway Config ---
spring.flyway.baseline-on-migrate=true