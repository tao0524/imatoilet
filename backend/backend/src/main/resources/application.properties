# PostgreSQL への接続設定
# ★重要: 環境変数 DB_URL, DB_USER, DB_PASSWORD の設定が必須です（デフォルト値廃止）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate の設定
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CORS / Server Config ---
# WebConfig.java の @Value("${app.cors.allowed-origins}") と一致させています
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:5173}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# ポート設定
server.port=${PORT:8080}

# --- Flyway Config ---
spring.flyway.baseline-on-migrate=true

# 修正3: 管理者認証情報 (環境変数で設定すること)
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}