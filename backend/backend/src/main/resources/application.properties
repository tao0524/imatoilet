# PostgreSQL への接続設定
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate の設定
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CORS / Server Config ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:5173}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# ポート設定
server.port=${PORT:8080}

# --- Flyway Config ---
spring.flyway.baseline-on-migrate=true

# ★追加: 管理者トークン認証 (本番環境では環境変数 ADMIN_TOKEN を必ず設定すること)
app.admin.token=${ADMIN_TOKEN:dev-admin-token-local}

spring.jpa.open-in-view=false

spring.flyway.out-of-order=true

# --- Sentry Config ---
sentry.dsn=${SENTRY_DSN:}

# --- Firebase Config ---
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}