# PostgreSQL への接続設定
spring.datasource.url=jdbc:postgresql://localhost:5432/imatoilet
spring.datasource.username=postgres
spring.datasource.password=MyNewPass3969
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate の設定
# ★変更: Flywayと競合しないよう 'update' から 'validate' に変更
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CORS / Server Config ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# ポート設定
server.port=${PORT:8080}

# --- Flyway Config (★新規追加) ---
# 既存のテーブルがあってもエラーにせず、そこを基準に進める設定
spring.flyway.baseline-on-migrate=true