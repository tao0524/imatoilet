# PostgreSQL への接続設定
spring.datasource.url=jdbc:postgresql://localhost:5432/imatoilet
spring.datasource.username=postgres
spring.datasource.password=MyNewPass3969
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate の設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CORS / Server Config ---
# 環境変数 CORS_ORIGINS がなければ localhost:5173 を使用
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
# Cookie認証等は現状未使用のため false
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# ポート設定: 環境変数 PORT がなければ 8080 を使用
server.port=${PORT:8080}