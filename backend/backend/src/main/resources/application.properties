# PostgreSQL への接続設定
spring.datasource.url=jdbc:postgresql://localhost:5432/imatoilet
spring.datasource.username=postgres
spring.datasource.password=hi4324de3969
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate の設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- フェーズ1追加: 環境変数設定 ---
# CORS設定: 環境変数 CORS_ORIGINS がなければ localhost:5173 を使用
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ポート設定: 環境変数 PORT がなければ 8080 を使用
server.port=${PORT:8080}